      fixed_level: {label: "A fixed level of performance"}
    points:
      fixed_level:
        - {period: 2026-09-22, value: 47, grade: "estimate", source: "https://epoch.ai/publications/the-plunging-price-of-thought", published: 2026-09-22, seen: 2026-11-07, note: "About 13x per year. By benchmark: AIME 47.1%, Chess Puzzles 43.0%, FrontierMath T1-3 53.1%, GPQA Diamond 47.0%, Mystery Game Puzzles 44.0%. Report: four times faster than DNA sequencing, six times faster than compute."}
