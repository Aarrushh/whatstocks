[project]
name = "whatstocks"
version = "0.1.0"
description = "A morning dashboard that holds you to your own views about the world."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2.50",
]

[project.scripts]
whatstocks = "whatstocks.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatstocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
